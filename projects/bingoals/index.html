<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homepage</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>BINGoals!</h1>
      <nav>
        <button>Dashboard</button>
        <button>BINGO Card</button>
      </nav>
    </header>

    <main class="dashboard">
      <section class="card progress-card">
        <div class="info-card">
          <h2>Overall Progress</h2>

          <p id="completed-goals">3 of 8 goals completed</p>

          <progress id="completed-goals-progress" value="3" max="8"></progress>
        </div>
      </section>

      <section class="card reward-card">
        <div class="info-card">
          <h2>Current Reward Goal</h2>
          <h3>New Bike</h3>
          <p>$20/$300 earned</p>
          <progress value="20" max="300"></progress>
          <p>$280 left to go!</p>
        </div>
      </section>

      <section class="card goal-card">
        <div class="info-card">
          <h2>Goal Stats</h2>
          <ul>
            <li>
              Completed :
              <span id="completed-count">3</span>
            </li>

            <li>
              In Progress:
              <span id="in-progress-count">1</span>
            </li>

            <li>
              Not Started:
              <span id="not-started-count">4</span>
            </li>
          </ul>
        </div>
      </section>

      <section class="card category-card">
        <div class="info-card">
          <h2>Category Progress</h2>

          <ul>
            <li>Career</li>
            <li>Health</li>
            <li>Finance</li>
            <li>Reading</li>
          </ul>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
