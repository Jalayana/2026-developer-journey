<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homepage</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header><h1>BINGoals!</h1></header>

    <section>
      <nav>
        <button>Dashboard</button>
        <button>BINGO</button>
      </nav>
    </section>

    <main>
      <section>
        <h2>Overall Progress</h2>

        <p>3 of 8 goals completed</p>

        <progress value="3" max="8"></progress>
      </section>

      <section>
        <h2>Current Reward Goal</h2>
        <h3>New Bike</h3>
        <p>$20/$300 earned</p>
        <progress value="20" max="300"></progress>
        <p>$250 left to go!</p>
      </section>
      <section>
        <h2>Goal Stats</h2>
        <ul>
          <li>
            Completed :
            <span>3</span>
          </li>

          <li>
            In Progress:
            <span>1</span>
          </li>

          <li>
            Not Started:
            <span>4</span>
          </li>
        </ul>
      </section>
      <section>
        <h2>Category Progress</h2>

        <ul>
          <li>Career</li>
          <li>Health</li>
          <li>Finance</li>
          <li>Reading</li>
        </ul>
      </section>
    </main>
  </body>
</html>
